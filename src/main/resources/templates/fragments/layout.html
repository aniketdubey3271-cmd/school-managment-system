<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | SMS'">SMS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body>

<nav th:fragment="navbar" class="navbar navbar-expand navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Student Management System</a>
        <div class="d-flex align-items-center gap-3 text-white">
            <span sec:authentication="name">user</span>
            <form th:action="@{/logout}" method="post" class="m-0">
                <button type="submit" class="btn btn-sm btn-outline-light">Logout</button>
            </form>
        </div>
    </div>
</nav>

<!-- Success/error messages, from flash attributes or the model -->
<div th:fragment="flash">
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
</div>

<!-- Back link: back(url, label) -->
<a th:fragment="back(url, label)" th:href="@{${url}}" class="d-inline-block mb-3 text-decoration-none"
   th:text="'← ' + ${label}">← Back</a>

</body>
</html>
