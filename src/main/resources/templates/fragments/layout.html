<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | SMS'">SMS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
      :root{--ink:#1c2d3f;--muted:#68798b;--navy:#17324d;--teal:#167d80;--teal-dark:#11696d;--line:#dfe7ec;--paper:#f4f7f8;--shadow:0 10px 28px rgba(24,48,69,.08)}
      *{box-sizing:border-box}body{font-family:'DM Sans',Arial,sans-serif;color:var(--ink);background:var(--paper);min-height:100vh}
      h1,h2,h3,.navbar-brand{font-family:Manrope,'DM Sans',Arial,sans-serif;letter-spacing:-.025em}.container{max-width:1120px}
      .navbar{background:#fff!important;border-bottom:1px solid var(--line);padding:13px 0}.navbar .container{gap:1rem}
      .navbar-brand{font-size:1rem;font-weight:800;color:var(--navy)!important;display:flex;align-items:center;gap:.7rem}
      .navbar-brand:before{content:'S';display:grid;place-items:center;width:34px;height:34px;border-radius:9px;color:#fff;background:var(--navy);font-size:.95rem}
      .navbar .small.fw-semibold{color:var(--muted)}.navbar .btn-outline-light{color:var(--navy);border-color:#cbd7df}.navbar .btn-outline-light:hover{background:var(--navy);color:#fff}
      .page-shell{padding:30px 0 64px;animation:rise .4s ease-out both}.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:.7rem;font-weight:700;color:#a9dada}
      .hero{position:relative;overflow:hidden;padding:34px 38px;border-radius:14px;background:var(--navy);color:#fff;margin-bottom:24px}
      .hero:after{content:'';position:absolute;width:230px;height:230px;right:8%;top:-150px;border:1px solid #ffffff1c;border-radius:50%;box-shadow:0 0 0 34px #ffffff08}
      .hero h1{font-size:clamp(1.8rem,4vw,2.45rem);font-weight:700;margin:.45rem 0}.hero p{color:#d1dce5;margin:0;max-width:620px}
      .portal-card{height:100%;display:block;text-decoration:none;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:12px;padding:21px;box-shadow:0 2px 6px #152b3b08;transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;animation:rise .4s both}
      .portal-card:hover{transform:translateY(-3px);color:var(--ink);box-shadow:var(--shadow);border-color:#9bc9ca}.portal-card:focus-visible{outline:3px solid #6db5b6;outline-offset:3px}
      .portal-card .icon{display:grid;place-items:center;width:38px;height:38px;border-radius:9px;background:#edf5f5;color:var(--teal);font-size:.78rem;font-weight:700;margin-bottom:16px}
      .portal-card h2{font-size:1rem;font-weight:700;margin-bottom:6px}.portal-card p{font-size:.88rem;color:var(--muted);margin:0;line-height:1.5}
      .stat{font:700 1.4rem Manrope,sans-serif;display:block;margin-top:10px;color:var(--teal)}.section-title{font-weight:700;font-size:1.1rem}
      .card{border:1px solid var(--line);border-radius:14px;box-shadow:0 3px 12px #152b3b08}.btn{border-radius:8px;font-weight:600}.btn-primary{background:var(--teal);border-color:var(--teal)}.btn-primary:hover{background:var(--teal-dark);border-color:var(--teal-dark)}.btn-outline-primary{color:var(--teal);border-color:#9bbabb}.btn-outline-primary:hover{background:var(--teal);border-color:var(--teal)}
      .form-control{border-radius:8px;border-color:#d2dde3;padding:.7rem .85rem}.form-control:focus{border-color:#4e999a;box-shadow:0 0 0 .2rem #167d8022}.alert{border:0;border-radius:9px}
      @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
      @media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
      @media(max-width:575px){.hero{padding:27px 23px}.navbar-brand{font-size:.9rem}.navbar .container{padding-inline:16px}}
    </style>
</head>
<body>
<nav th:fragment="navbar" class="navbar navbar-expand mb-4"><div class="container"><a class="navbar-brand" th:href="@{/}">Student Management System</a><div class="d-flex align-items-center gap-3"><span sec:authentication="name" class="small fw-semibold">user</span><form th:action="@{/logout}" method="post" class="m-0"><button type="submit" class="btn btn-sm btn-outline-light">Logout</button></form></div></div></nav>
<div th:fragment="flash"><div th:if="${success}" class="alert alert-success" th:text="${success}"></div><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div></div>
<a th:fragment="back(url, label)" th:href="@{${url}}" class="d-inline-block mb-3 text-decoration-none" th:text="'← ' + ${label}">← Back</a>
</body></html>
