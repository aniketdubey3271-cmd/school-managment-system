<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Class ' + ${schoolClass.displayName})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">
    <a th:replace="~{fragments/layout :: back('/admin/classes', 'Classes')}"></a>
    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center mb-1">
        <h1 class="h3 m-0" th:text="'Class ' + ${schoolClass.displayName}">Class</h1>
        <div class="d-flex gap-2">
            <a th:href="@{/admin/reports/classes/{id}(id=${schoolClass.id})}" class="btn btn-outline-primary">Report</a>
            <a th:href="@{/admin/classes/{id}/edit(id=${schoolClass.id})}" class="btn btn-outline-secondary">Edit</a>
            <form th:action="@{/admin/classes/{id}/delete(id=${schoolClass.id})}" method="post"
                  onsubmit="return confirm('Delete this class?')">
                <button type="submit" class="btn btn-outline-danger">Delete</button>
            </form>
        </div>
    </div>
    <p class="text-muted">
        Class teacher:
        <span th:text="${schoolClass.classTeacher} ? ${schoolClass.classTeacher.name} : 'not set'"></span>
    </p>

    <div class="row g-4">
        <div class="col-lg-6">
            <h2 class="h5">Subject teachers</h2>
            <table class="table align-middle">
                <thead><tr><th>Subject</th><th>Teacher</th><th></th></tr></thead>
                <tbody>
                <tr th:each="a : ${assignments}">
                    <td th:text="${a.subject.name}"></td>
                    <td th:text="${a.teacher.name}"></td>
                    <td class="text-end">
                        <form th:action="@{/admin/classes/{id}/assignments/{aid}/delete(id=${schoolClass.id}, aid=${a.id})}"
                              method="post" onsubmit="return confirm('Remove this assignment?')">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Remove</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(assignments)}">
                    <td colspan="3" class="text-center text-muted">No subjects assigned yet.</td>
                </tr>
                </tbody>
            </table>

            <form th:action="@{/admin/classes/{id}/assignments(id=${schoolClass.id})}" method="post" class="row g-2">
                <div class="col-sm-5">
                    <select name="subjectId" class="form-select" required>
                        <option value="">Subject</option>
                        <option th:each="s : ${subjects}" th:value="${s.id}" th:text="${s.name}"></option>
                    </select>
                </div>
                <div class="col-sm-5">
                    <select name="teacherId" class="form-select" required>
                        <option value="">Teacher</option>
                        <option th:each="t : ${teachers}" th:value="${t.id}" th:text="${t.name}"></option>
                    </select>
                </div>
                <div class="col-sm-2"><button type="submit" class="btn btn-primary w-100">Assign</button></div>
            </form>
            <p class="form-text" th:if="${#lists.isEmpty(subjects)}">
                No subjects yet: <a th:href="@{/admin/subjects}">add subjects</a>.
            </p>
        </div>

        <div class="col-lg-6">
            <div class="d-flex justify-content-between align-items-center">
                <h2 class="h5" th:text="'Students (' + ${#lists.size(students)} + ')'">Students</h2>
                <a th:href="@{/admin/students/new(classId=${schoolClass.id})}" class="btn btn-sm btn-outline-primary">Add student</a>
            </div>
            <table class="table">
                <thead><tr><th>Roll no</th><th>Name</th></tr></thead>
                <tbody>
                <tr th:each="s : ${students}">
                    <td th:text="${s.rollNo}"></td>
                    <td><a th:href="@{/admin/students/{id}/edit(id=${s.id})}" th:text="${s.name}"></a></td>
                </tr>
                <tr th:if="${#lists.isEmpty(students)}">
                    <td colspan="2" class="text-center text-muted">No students in this class.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
