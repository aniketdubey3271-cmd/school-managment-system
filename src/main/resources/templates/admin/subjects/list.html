<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Subjects')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container" style="max-width: 640px">
    <a th:replace="~{fragments/layout :: back('/admin/dashboard', 'Dashboard')}"></a>
    <div th:replace="~{fragments/layout :: flash}"></div>
    <h1 class="h3 mb-3">Subjects</h1>

    <form th:action="@{/admin/subjects}" method="post" class="d-flex gap-2 mb-4">
        <input type="text" name="name" class="form-control" placeholder="New subject, e.g. Mathematics"
               maxlength="100" required>
        <button type="submit" class="btn btn-primary text-nowrap">Add subject</button>
    </form>

    <ul class="list-group">
        <li th:each="s : ${subjects}" class="list-group-item d-flex justify-content-between align-items-center">
            <span th:text="${s.name}"></span>
            <form th:action="@{/admin/subjects/{id}/delete(id=${s.id})}" method="post"
                  onsubmit="return confirm('Delete this subject?')">
                <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
            </form>
        </li>
        <li th:if="${#lists.isEmpty(subjects)}" class="list-group-item text-center text-muted">No subjects yet.</li>
    </ul>
</div>

</body>
</html>
