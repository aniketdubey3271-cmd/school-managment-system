<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${form.id == null} ? 'Add teacher' : 'Edit teacher')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container" style="max-width: 640px">
    <a th:replace="~{fragments/layout :: back('/admin/teachers', 'Teachers')}"></a>
    <h1 class="h3 mb-4" th:text="${form.id == null} ? 'Add teacher' : 'Edit teacher'">Teacher</h1>

    <form th:object="${form}" method="post"
          th:action="${form.id == null} ? @{/admin/teachers} : @{/admin/teachers/{id}(id=${form.id})}">
        <div th:replace="~{fragments/form :: globalErrors}"></div>

        <h2 class="h6 text-muted">Login</h2>
        <div class="mb-3">
            <label class="form-label" for="username">Username</label>
            <input type="text" class="form-control" th:field="*{username}" th:errorclass="is-invalid"
                   th:readonly="${form.id != null}">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
        </div>
        <div th:replace="~{fragments/form :: field('email', 'Email', 'email')}"></div>
        <div th:replace="~{fragments/form :: password(${form.id == null} ? 'Password' : 'New password',
                ${form.id == null} ? 'At least 8 characters.' : 'Leave blank to keep the current password.')}"></div>
        <div class="form-check mb-4" th:if="${form.id != null}">
            <input type="checkbox" class="form-check-input" th:field="*{enabled}">
            <label class="form-check-label" th:for="${#ids.prev('enabled')}">Account active (can log in)</label>
        </div>

        <h2 class="h6 text-muted">Profile</h2>
        <div th:replace="~{fragments/form :: field('name', 'Full name', 'text')}"></div>
        <div th:replace="~{fragments/form :: field('subjectSpecialization', 'Subject specialization', 'text')}"></div>
        <div th:replace="~{fragments/form :: field('contact', 'Contact number', 'tel')}"></div>

        <button type="submit" class="btn btn-primary">Save</button>
        <a th:href="@{/admin/teachers}" class="btn btn-link">Cancel</a>
    </form>
</div>

</body>
</html>
