<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Grades ' + ${assignment.subject.name})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container" style="max-width: 720px">
    <a th:replace="~{fragments/layout :: back('/teacher/classes', 'My Classes')}"></a>
    <div th:replace="~{fragments/layout :: flash}"></div>
    <h1 class="h3 mb-3"
        th:text="${assignment.subject.name} + ' grades: ' + ${assignment.schoolClass.displayName}">Grades</h1>

    <!-- Pick an exam (GET reloads with that exam's saved marks) -->
    <form method="get" class="mb-3" style="max-width: 240px">
        <label for="exam" class="form-label">Exam</label>
        <select id="exam" name="exam" class="form-select" onchange="this.form.submit()">
            <option th:each="e : ${examTypes}" th:value="${e}" th:text="${e.label}"
                    th:selected="${e == form.examType}"></option>
        </select>
    </form>

    <div th:if="${#lists.isEmpty(students)}" class="alert alert-warning">No students in this class yet.</div>

    <form th:unless="${#lists.isEmpty(students)}" method="post"
          th:action="@{/teacher/classes/{cid}/subjects/{sid}/grades(cid=${assignment.schoolClass.id}, sid=${assignment.subject.id})}">
        <input type="hidden" name="examType" th:value="${form.examType}">
        <div class="mb-3" style="max-width: 240px">
            <label for="maxMarks" class="form-label">Max marks</label>
            <input type="number" id="maxMarks" name="maxMarks" class="form-control" min="1" max="999" step="0.01"
                   th:value="${form.maxMarks}" required>
        </div>
        <table class="table align-middle">
            <thead><tr><th>Roll no</th><th>Name</th><th style="width: 160px">Marks</th></tr></thead>
            <tbody>
            <tr th:each="s : ${students}">
                <td th:text="${s.rollNo}"></td>
                <td th:text="${s.name}"></td>
                <td>
                    <input type="number" class="form-control" min="0" step="0.01"
                           th:name="'marks[' + ${s.id} + ']'" th:value="${form.marks[s.id]}">
                </td>
            </tr>
            </tbody>
        </table>
        <p class="form-text">Leave a box blank to skip that student.</p>
        <button type="submit" class="btn btn-primary">Save marks</button>
    </form>
</div>

</body>
</html>
