<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${form.id == null} ? 'New assignment' : 'Edit assignment')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container" style="max-width: 640px">
    <a th:replace="~{fragments/layout :: back('/teacher/assignments', 'Assignments')}"></a>
    <h1 class="h3 mb-4" th:text="${form.id == null} ? 'New assignment' : 'Edit assignment'">Assignment</h1>

    <div th:if="${form.id == null && #lists.isEmpty(teachable)}" class="alert alert-warning">
        You aren't assigned to teach any subject yet, so you can't create assignments.
    </div>

    <form th:object="${form}" method="post"
          th:action="${form.id == null} ? @{/teacher/assignments} : @{/teacher/assignments/{id}(id=${form.id})}">
        <div th:replace="~{fragments/form :: globalErrors}"></div>

        <div class="mb-3" th:if="${form.id == null}">
            <label class="form-label" for="teachingId">Class and subject</label>
            <select class="form-select" th:field="*{teachingId}" th:errorclass="is-invalid">
                <option value="">Select</option>
                <option th:each="t : ${teachable}" th:value="${t.id}"
                        th:text="${t.schoolClass.displayName} + ' · ' + ${t.subject.name}"></option>
            </select>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('teachingId')}" th:errors="*{teachingId}"></div>
        </div>
        <p th:unless="${form.id == null}" class="text-muted"
           th:text="${assignment.schoolClass.displayName} + ' · ' + ${assignment.subject.name}"></p>

        <div th:replace="~{fragments/form :: field('title', 'Title', 'text')}"></div>
        <div class="mb-3">
            <label class="form-label" for="description">Instructions</label>
            <textarea class="form-control" rows="5" th:field="*{description}" th:errorclass="is-invalid"></textarea>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
        </div>
        <div th:replace="~{fragments/form :: field('dueDate', 'Due date and time', 'datetime-local')}"></div>

        <button type="submit" class="btn btn-primary">Save</button>
        <a th:href="${form.id == null} ? @{/teacher/assignments} : @{/teacher/assignments/{id}(id=${form.id})}"
           class="btn btn-link">Cancel</a>
    </form>
</div>

</body>
</html>
