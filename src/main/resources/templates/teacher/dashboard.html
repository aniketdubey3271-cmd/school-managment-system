<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Teacher Dashboard')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">
    <h1 class="h3 mb-4">Teacher Dashboard</h1>
    <div class="row g-3">
        <div class="col-md-4">
            <a th:href="@{/teacher/classes}" class="card card-body text-decoration-none">
                My Classes
                <small class="text-muted">Students, attendance and grades</small>
            </a>
        </div>
        <div class="col-md-4">
            <a th:href="@{/teacher/assignments}" class="card card-body text-decoration-none">
                Assignments
                <small class="text-muted">Set work and see submissions</small>
            </a>
        </div>
        <div class="col-md-4">
            <a th:href="@{/teacher/announcements}" class="card card-body text-decoration-none">
                Announcements
                <small class="text-muted">Message your classes</small>
            </a>
        </div>
    </div>
</div>

</body>
</html>
