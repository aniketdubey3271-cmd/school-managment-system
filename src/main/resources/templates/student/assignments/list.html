<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('My Assignments')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container" style="max-width: 840px">
    <a th:replace="~{fragments/layout :: back('/student/dashboard', 'Dashboard')}"></a>
    <h1 class="h3 mb-3">My Assignments</h1>

    <div class="list-group">
        <a th:each="r : ${rows}" th:href="@{/student/assignments/{id}(id=${r.assignment.id})}"
           class="list-group-item list-group-item-action d-flex justify-content-between align-items-start gap-3">
            <div>
                <div class="fw-semibold" th:text="${r.assignment.title}">Title</div>
                <small class="text-muted"
                       th:text="${r.assignment.subject.name} + ' · due ' + ${#temporals.format(r.assignment.dueDate, 'dd MMM yyyy, HH:mm')}"></small>
            </div>
            <span th:if="${r.submission != null}" class="badge text-bg-success">Submitted</span>
            <span th:if="${r.submission == null && !r.pastDue}" class="badge text-bg-warning">To do</span>
            <span th:if="${r.submission == null && r.pastDue}" class="badge text-bg-danger">Missed</span>
        </a>
        <div th:if="${#lists.isEmpty(rows)}" class="list-group-item text-center text-muted">No assignments yet.</div>
    </div>
</div>

</body>
</html>
