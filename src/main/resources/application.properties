spring.application.name=sms

# Database: a single SQLite file (created on first run). foreign_keys=on makes SQLite enforce FKs.
spring.datasource.url=${DB_URL:jdbc:sqlite:./sms.db?foreign_keys=on}
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite allows one writer at a time; a single connection avoids "database is locked" errors.
spring.datasource.hikari.maximum-pool-size=1
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# Flyway owns the schema. Hibernate's validate is off: SQLite's loose typing
# (INTEGER keys vs Java Long) makes it reject a correct schema.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Assignment uploads (FileStorage also enforces 10 MB and the allowed file types)
sms.uploads.dir=${SMS_UPLOADS_DIR:./uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
# Read (and discard) up to 20MB of an oversized upload so the browser gets the
# "too large" message instead of a hung or reset connection.
server.tomcat.max-swallow-size=20MB

# Printed on report cards and ID cards
sms.school.name=${SMS_SCHOOL_NAME:Student Management System}

# First admin account, created on startup only if no admin exists.
# Password has no default: set SMS_ADMIN_PASSWORD before first run.
sms.admin.username=${SMS_ADMIN_USERNAME:admin}
sms.admin.email=${SMS_ADMIN_EMAIL:admin@school.local}
sms.admin.password=${SMS_ADMIN_PASSWORD:}
