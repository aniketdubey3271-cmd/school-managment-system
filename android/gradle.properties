org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Address of the SMS backend the app talks to. Must end with "/".
#   Emulator, backend on this computer:   http://10.0.2.2:8080/
#   Real phone on the same Wi-Fi:         http://<this computer's LAN IP>:8080/
#   APK handed to the school:             https://<your deployed server>/
# Debug builds allow plain http; release builds require https.
sms.apiBaseUrl=http://10.0.2.2:8080/
